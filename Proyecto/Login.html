<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ORIENTA - Iniciar Sesión</title>
        <link rel="stylesheet" href="css/estilologin.css">
    </head>
    <body>
        <div class="card">
            <!-- LOGO ORIENTA -->
            <div class="logo">
                <span class="logo-icon">⁘</span>
                <span class="logo-text">ORIENTA</span>
            </div>
            <h1>INICIAR SESIÓN</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="usuario">Cuenta / nombre de usuario</label>
                    <input type="text" id="usuario" placeholder="Ingresa tu cuenta o nombre de usuario"
                    required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrap">
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                    <button type="button" class="eye-btn" onclick="togglePass()">👁️</button>
                    </div>
                </div>
                <button type="submit"    class="btn-entrar">ENTRAR</button>
            </form>
            <div class="register">
                ¿no tienes cuenta?
                <a href="Registro.html">REGÍSTRATE</a>
                <a href="Inicio.html">inicio</a>
            </div>
        </div>
        <script>
            function togglePass() {
            const pass = document.getElementById('password');
            pass.type = pass.type === 'password' ? 'text' : 'password';
            }
            document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('usuario').value;
            alert('Bienvenido ' + user + ' 👋\nAquí conectarías con tu backend / Firebase');
            });
        </script>
    </body>
</html>
