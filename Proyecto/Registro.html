<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ORIENTA - Registro</title>
        <link rel="stylesheet" href="css/estiloregistro.css">
    </head>
    <body>
        <div class="card">
            <h1>REGISTRO</h1>
            <form id="formRegistro">
                <label class="title" for="usuario">Cuenta/nombre de usuario</label>
                <input type="text" id="usuario" placeholder="Ingresa tu cuenta o nombre de usuario" required>
                <label class="title" for="password">Contraseña</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                    <button type="button" class="eye-btn" onclick="togglePass()">👁️</button>
                </div>
                <p class="apoyo-titulo">¿Qué tipo de apoyo necesitas?</p>
                <p class="apoyo-sub">Selecciona todas las que necesites</p>
                <div id="listaApoyos">
                    <label class="opcion"><span class="opcion-left"><input type="checkbox" value="Lector de pantalla"><span class="radio-custom"></span>Lector de pantalla</span><span class="flecha"></span></label>
                    <label class="opcion"><span class="opcion-left"><input type="checkbox" value="Lengua de señas mexicana"><span class="radio-custom"></span>Lengua de señasmexicana</span><span class="flecha"></span></label>
                    <label class="opcion"><span class="opcion-left"><input type="checkbox" value="Textogrande"><span class="radio-custom"></span>Texto grande</span><span class="flecha"></span></label>
                    <label class="opcion"><span class="opcion-left"><input type="checkbox" value="Navegación por voz"><span class="radio-custom"></span>Navegación por voz</span><span class="flecha"></span></label>
                    <label class="opcion"><span class="opcion-left"><input type="checkbox" value="Textoen lenguaje facil"><span class="radio-custom"></span>Texto en lenguaje facil</span><span class="flecha"></span></label>
                    <label class="opcion"><span class="opcion-left"><input type="checkbox" value="Interprete"><span class="radio-custom"></span>Interprete</span><span class="flecha"></span></label>
                    <label class="opcion"><span class="opcion-left"><input type="checkbox" value="Ninguna de las anteriores" id="ninguna"><span class="radio-custom"></span>Ninguna de las anteriores</span><span class="flecha"></span></label>
                </div>
                <button type="submit" class="btn-registrar">REGISTRARME</button>
            </form>
            <a href="#" class="omitir" onclick="omitir(event)">omitir por ahora</a>
            <a href="login.html" class="volver">¿Ya tienes cuenta? Iniciar sesión</a>
        </div>
        <script>
            function togglePass() {
                const p = document.getElementById('password');
                p.type = p.type === 'password' ? 'text' : 'password';
            }
            // Pintar opcion cuando se selecciona
            document.querySelectorAll('.opcion input').forEach(chk => {
                chk.addEventListener('change', function() {
                // Si elige "Ninguna", desmarca las demás
                if (this.id === 'ninguna' && this.checked) {
            document.querySelectorAll('.opcion input').forEach(o => {
                if (o.id !== 'ninguna') { o.checked = false;
                o.closest('.opcion').classList.remove('seleccionada'); }
                });
            } else if (this.checked) {
            const ninguna = document.getElementById('ninguna');
            ninguna.checked = false;
            ninguna.closest('.opcion').classList.remove('seleccionada');
            }
            this.closest('.opcion').classList.toggle('seleccionada', this.checked);
            });
            });
            document.getElementById('formRegistro').addEventListener('submit', function(e) {
                e.preventDefault();
                const user = document.getElementById('usuario').value;
                const seleccionados = [...document.querySelectorAll('.opcion input:checked')].map(c =>
                c.value);
                alert('¡Registro listo! ✅\nUsuario: ' + user + '\nApoyos: ' + (seleccionados.length ?
                seleccionados.join(', ') : 'Ninguno'));
                });
            function omitir(e) {
                e.preventDefault();
                alert('Registro omitido, puedes configurarlo después en tu perfil.');
                // Aquí lo mandas a la pantalla principal
                // window.location.href = 'home.html';
                }
        </script>
    </body>
</html>
