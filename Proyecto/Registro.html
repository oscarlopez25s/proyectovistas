<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ORIENTA - Registro</title>
        <link rel="stylesheet" href="css/estiloregistro.css">
    </head>
    <body>
        <div class="card">
            <h1>REGISTRO</h1>
            <form id="formRegistro">
                <label class="title" for="usuario">Cuenta/nombre de usuario</label>
                <input type="text" id="usuario" placeholder="Ingresa tu cuenta o nombre de usuario" required>
                <label class="title" for="password">Contraseña</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                    <button type="button" class="eye-btn" onclick="togglePass()">👁️</button>
                </div>
                <p class="apoyo-titulo">¿Qué tipo de apoyo necesitas?</p>
                <p class="apoyo-sub">Selecciona todas las que necesites</p>
                <div id="listaApoyos">
                    <label class="opcion"><span class="opcion-left"><input type="checkbox" value="1"><span class="radio-custom"></span>Lector de pantalla</span><span class="flecha"></span></label>
                    <label class="opcion"><span class="opcion-left"><input type="checkbox" value="2"><span class="radio-custom"></span>Lengua de señas mexicana</span><span class="flecha"></span></label>
                    <label class="opcion"><span class="opcion-left"><input type="checkbox" value="3"><span class="radio-custom"></span>Texto grande</span><span class="flecha"></span></label>
                    <label class="opcion"><span class="opcion-left"><input type="checkbox" value="4"><span class="radio-custom"></span>Navegación por voz</span><span class="flecha"></span></label>
                    <label class="opcion"><span class="opcion-left"><input type="checkbox" value="5"><span class="radio-custom"></span>Texto en lenguaje fácil</span><span class="flecha"></span></label>
                    <label class="opcion"><span class="opcion-left"><input type="checkbox" value="6"><span class="radio-custom"></span>Intérprete</span><span class="flecha"></span></label>
                    <label class="opcion"><span class="opcion-left"><input type="checkbox" value="7" id="ninguna"><span class="radio-custom"></span>Ninguna de las anteriores</span><span class="flecha"></span></label>
                </div>
                <button type="submit" class="btn-registrar">REGISTRARME</button>
            </form>
            <a href="#" class="omitir" onclick="omitir(event)">omitir por ahora</a>
            <a href="login.html" class="volver">¿Ya tienes cuenta? Iniciar sesión</a>
        </div>
        <script>
            function togglePass() {
                const p = document.getElementById('password');
                p.type = p.type === 'password' ? 'text' : 'password';
            }
            // Pintar opcion cuando se selecciona
            document.querySelectorAll('.opcion input').forEach(chk => {
                chk.addEventListener('change', function() {
                // Si elige "Ninguna", desmarca las demás
                if (this.id === 'ninguna' && this.checked) {
            document.querySelectorAll('.opcion input').forEach(o => {
                if (o.id !== 'ninguna') { o.checked = false;
                o.closest('.opcion').classList.remove('seleccionada'); }
                });
            } else if (this.checked) {
            const ninguna = document.getElementById('ninguna');
            ninguna.checked = false;
            ninguna.closest('.opcion').classList.remove('seleccionada');
            }
            this.closest('.opcion').classList.toggle('seleccionada', this.checked);
            });
            });
            document.getElementById('formRegistro').addEventListener('submit', async function(e) {e.preventDefault();
            const usuario = document.getElementById('usuario').value;  
            const password = document.getElementById('password').value;
            const apoyos = [...document.querySelectorAll('#listaApoyos input:checked')]
            .map(c => c.value);
                try {
            const respuesta = await fetch('registrar.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                usuario: usuario,
                password: password,
                apoyos: apoyos
                })
            });
            const resultado = await respuesta.json();
            alert(resultado.mensaje);
            if (resultado.success) {
            window.location.href = 'login.html';
            }
            } catch (error) {
                console.error("Error completo:", error);
                alert("Error: " + error.message);
            }
            });
        </script>
    </body>
</html>
